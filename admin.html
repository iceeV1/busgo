<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BusGo Admin — หลังบ้าน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="admin">

  <!-- LOGIN -->
  <div class="login-overlay" id="loginOverlay">
    <form class="login-card glass-strong" id="loginForm">
      <h2>BusGo Admin</h2>
      <p class="muted small">เข้าสู่ระบบผู้ดูแลหลังบ้าน</p>
      <input type="password" id="adminPass" placeholder="รหัสผ่านผู้ดูแล" required autocomplete="current-password" />
      <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
      <p class="muted small">รหัสผ่านเริ่มต้น: <code>admin1234</code></p>
    </form>
  </div>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-inner">
      <div class="logo">Bus<span class="logo-accent">Go</span><span class="admin-tag">ADMIN</span></div>
      <div class="nav">
        <a href="/" class="nav-link" style="text-decoration:none">← หน้าเว็บหลัก</a>
        <button class="nav-link" id="logoutBtn">ออกจากระบบ</button>
      </div>
    </div>
  </header>

  <main class="container admin-main">
    <nav class="admin-tabs">
      <button class="nav-link active" data-tab="dash">ภาพรวม</button>
      <button class="nav-link" data-tab="bookings">การจอง</button>
      <button class="nav-link" data-tab="buses">จัดการรอบรถ</button>
        <button class="nav-link" data-tab="promos">โปรโมชั่น</button>
    </nav>

    <!-- DASHBOARD -->
    <section id="tab-dash">
      <div class="stat-cards" id="statCards"></div>
      <div class="panel glass">
        <h3>เส้นทางยอดนิยม (ตามตั๋วที่ยืนยันแล้ว)</h3>
        <div id="routeBars"></div>
      </div>
    </section>

    <!-- BOOKINGS -->
    <section id="tab-bookings" class="hidden">
      <div class="filter-row glass">
        <input type="search" id="bkSearch" placeholder="ค้นหารหัส / ชื่อ / เบอร์โทร..." />
        <input type="date" id="bkDate" />
        <select id="bkStatus">
          <option value="">ทุกสถานะ</option>
          <option value="active">ยืนยันแล้ว</option>
          <option value="cancelled">ยกเลิกแล้ว</option>
        </select>
        <button class="btn btn-primary btn-sm" id="bkRefresh" style="padding:11px 18px">รีเฟรช</button>
        <button class="btn btn-ghost btn-sm" id="csvBtn" style="padding:11px 18px">Export CSV</button>
      </div>
      <div class="table-wrap glass"><table class="data-table" id="bkTable"></table></div>
    </section>

    <!-- BUSES -->
    <section id="tab-buses" class="hidden">
      <div class="filter-row glass">
        <span class="muted small">จัดการเที่ยวรถทั้งหมด — เพิ่ม แก้ไข หรือลบรอบรถได้ทันที</span>
        <span style="flex:1"></span>
        <button class="btn btn-primary btn-sm" id="addBusBtn" style="padding:11px 18px">+ เพิ่มเที่ยวรถ</button>
      </div>
      <div class="table-wrap glass"><table class="data-table" id="busTable"></table></div>
    </section>

    <!-- PROMOTIONS -->
    <section id="tab-promos" class="hidden">
      <div class="filter-row glass">
        <input type="text" id="prCode" placeholder="รหัสโค้ด เช่น SALE20" maxlength="20" />
        <input type="number" id="prPercent" placeholder="ส่วนลด %" min="1" max="90" style="max-width:140px" />
        <button class="btn btn-primary btn-sm" id="prAdd" style="padding:11px 18px">+ เพิ่มโค้ดส่วนลด</button>
        <span style="flex:1"></span>
        <span class="muted small">ผู้โดยสารใส่โค้ดตอนกรอกข้อมูลก่อนชำระเงิน</span>
      </div>
      <div class="table-wrap glass"><table class="data-table" id="promoTable"></table></div>
    </section>

    <!-- BUS FORM MODAL -->
    <div class="modal-overlay hidden" id="busModal">
      <div class="modal glass-strong">
        <div class="modal-head">
          <h3 id="busFormTitle">เพิ่มเที่ยวรถ</h3>
          <button class="close-btn" id="busClose">&#215;</button>
        </div>
        <form id="busForm" class="info-form form-grid" onsubmit="return false">
          <label>ต้นทาง<input id="fFrom" required placeholder="เช่น กรุงเทพฯ" /></label>
          <label>ปลายทาง<input id="fTo" required placeholder="เช่น เชียงใหม่" /></label>
          <label>เวลาออก
            <input type="hidden" id="fDepart" />
            <div class="time-field" data-time="fDepart">
              <span class="tf-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
              <select class="tf-hour" aria-label="ชั่วโมง"></select>
              <span class="tf-colon">:</span>
              <select class="tf-min" aria-label="นาที"></select>
              <span class="tf-suffix">น.</span>
            </div>
          </label>
          <label>เวลาถึง
            <input type="hidden" id="fArrive" />
            <div class="time-field" data-time="fArrive">
              <span class="tf-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
              <select class="tf-hour" aria-label="ชั่วโมง"></select>
              <span class="tf-colon">:</span>
              <select class="tf-min" aria-label="นาที"></select>
              <span class="tf-suffix">น.</span>
            </div>
          </label>
          <label>ระยะเวลา<input id="fDuration" required placeholder="เช่น 9 ชม. 30 นาที" /></label>
          <label>ชนิดการเดินทาง
            <input type="hidden" id="fMode" value="bus" />
            <div class="seg-group" id="modeSeg">
              <button type="button" class="seg-btn active" data-mode="bus"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg>รถบัส</button>
              <button type="button" class="seg-btn" data-mode="train"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 10h16"/><circle cx="8.5" cy="13.5" r=".5"/><circle cx="15.5" cy="13.5" r=".5"/><path d="m6 21 1.5-4"/><path d="m18 21-1.5-4"/></svg>รถไฟ</button>
              <button type="button" class="seg-btn" data-mode="ferry"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.94 5.34 2.81 7.76"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/><path d="M12 10v4"/><path d="M12 2v3"/></svg>เรือเฟอร์รี่</button>
            </div>
          </label>
          <label>ประเภทรถ
            <select id="fType">
              <option value="vip">VIP (32 ที่นั่ง)</option>
              <option value="air">ปรับอากาศ (44 ที่นั่ง)</option>
              <option value="eco">ธรรมดา (48 ที่นั่ง)</option>
            </select>
          </label>
          <label>ราคา (บาท)<input type="number" id="fPrice" min="0" step="10" required /></label>
        </form>
        <div class="modal-actions">
          <span></span>
          <button class="btn btn-primary" id="busSave">บันทึก</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </main>

  <div class="container">
    <div id="adminVersion" class="version-tag" style="padding:4px 0 34px">กำลังตรวจสอบเวอร์ชัน...</div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
